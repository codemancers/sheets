name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Fail fast if TypeScript project references are out of sync.
      - run: pnpm exec nx sync:check

      # Sets NX_BASE/NX_HEAD: the last successful run on main, and this commit.
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec playwright install --with-deps
      - run: pnpm exec nx format:check
      - run: pnpm dlx knip@6
      - run: pnpm exec nx affected -t lint test build typecheck e2e publint
